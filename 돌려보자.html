<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>돌려보자!</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f2;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#183d35}.wrap{max-width:1100px;margin:auto;padding:25px 16px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 5px;color:#087b60}.sub{color:#597168;margin:0 0 18px}.layout{display:grid;grid-template-columns:1fr 250px;gap:16px}.card{background:white;border:1px solid #dce9df;border-radius:24px;box-shadow:0 9px 30px #315d3712;padding:16px}canvas{width:100%;height:550px;display:block;touch-action:none;border-radius:18px;background:linear-gradient(#fbfffd,#edf6f1)}button{cursor:pointer;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:750;background:#e7f2eb;color:#225b4b}button.active{background:#008967;color:white}.choices{display:grid;gap:10px}.tip{font-size:14px;color:#567168;line-height:1.65}.meter{height:12px;background:#e5ede7;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#f2aa4e;transition:width .12s}.badge{font-weight:800;font-size:19px;margin:10px 0}.foot{font-size:13px;color:#667d70;margin-top:10px}@media(max-width:740px){.layout{grid-template-columns:1fr}canvas{height:490px}.choices{grid-template-columns:repeat(3,1fr)}button{font-size:14px;padding:11px 4px}}</style></head><body><div class="wrap"><h1>🌀 돌려보자!</h1><p class="sub">평면도형을 막대에 붙이고 두 손으로 빠르게 비벼 보자. 무엇이 보일까?</p><div class="layout"><div class="card"><canvas id="cv" aria-label="회전하는 평면도형 체험"></canvas><div class="foot">👆 아래 손 부분을 좌우로 빠르게 왕복해서 문질러 보세요. 클릭 한 번으로는 회전하지 않아요.</div></div><div class="card"><h3>① 도형 고르기</h3><div class="choices"><button class="active" data-shape="rect">▭ 직사각형</button><button data-shape="tri">◺ 직각삼각형</button><button data-shape="semi">◖ 반원</button></div><h3>② 막대 비비기</h3><p class="tip">실제로 <b>평면도형 한 장</b>이 회전해요. 회전 속도 100%에 도달하면 여러 회전 위치의 잔상이 겹쳐져 회전체가 드러나요.</p><div class="badge" id="status">아직 멈춰 있어요</div><div class="meter"><div class="fill" id="fill"></div></div><p class="tip" id="speed">회전 속도 0%</p><button id="reset" style="width:100%">↺ 다시 시작</button><p class="tip">💡 100%에서만 회전 잔상이 나타나요. 원기둥·원뿔의 둥근 밑면도 관찰해 보세요.</p></div></div></div><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;function resize(){let r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let shape='rect',theta=.35,omega=0,drag=false,lastX=0,lastDir=0,lastT=0,stroke=0,handShift=0,prev=performance.now();let trails=[];const colors={rect:'#ef9688',tri:'#ffc36c',semi:'#9ccfa9'};
function projection(x,y,z){const elev=.28;const zz=z*Math.cos(elev)+y*Math.sin(elev);const yy=y*Math.cos(elev)-z*Math.sin(elev);const perspective=720/(720-zz);const s=Math.min(W/480,H/520);return [W*.5+x*s*perspective,H*.43-yy*s*perspective]}
function pathAt(angle){const c=Math.cos(angle),s=Math.sin(angle);const points=[];let poly;if(shape==='rect')poly=[[0,-106],[83,-106],[83,106],[0,106]];else if(shape==='tri')poly=[[0,108],[0,-108],[95,108]];else{poly=[[0,-108]];for(let i=0;i<=48;i++){let a=-Math.PI/2+Math.PI*i/48;poly.push([-108*Math.cos(a),108*Math.sin(a)])}poly.push([0,108])}for(const [r,y] of poly)points.push(projection(r*c,y,r*s));return points}
function drawPoly(pts,alpha){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=colors[shape];ctx.globalAlpha=alpha;ctx.fill();ctx.strokeStyle='#405b4b';ctx.lineWidth=1.7;ctx.stroke();ctx.globalAlpha=1}
function fullSpeedAfterimage(){
// At maximum speed, accumulate many angular positions of the SAME flat sheet.
// Depth sorting plus a tilted camera produces elliptical circular rims.
const N=90;
for(let i=0;i<N;i++){
 const a=theta+2*Math.PI*i/N;
 const pts=pathAt(a);
 ctx.save();ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();
 ctx.fillStyle=colors[shape];ctx.globalAlpha=.035;ctx.fill();ctx.restore();
}
// Emphasize the swept boundary with a light, transparent contour.
const rad=shape==='rect'?83:shape==='tri'?95:108;
const heights=shape==='rect'?[-106,106]:shape==='tri'?[108]:[-108,108];
ctx.save();ctx.strokeStyle=colors[shape];ctx.globalAlpha=.48;ctx.lineWidth=1.6;
for(const y of heights){ctx.beginPath();for(let i=0;i<=96;i++){let a=2*Math.PI*i/96;let pt=projection(rad*Math.cos(a),y,rad*Math.sin(a));i?ctx.lineTo(...pt):ctx.moveTo(...pt)}ctx.stroke()}
ctx.restore();
}
function hands(){const x=W/2,y=H*.79;ctx.save();ctx.translate(x,y);const sc=Math.min(W/450,1.1);ctx.scale(sc,sc);function hand(side){ctx.save();ctx.translate(side*77+handShift*side*.35,0);ctx.scale(side,1);ctx.fillStyle='#f1bc9e';ctx.strokeStyle='#c58a70';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-31);ctx.bezierCurveTo(22,-46,45,-40,57,-18);ctx.lineTo(95,22);ctx.lineTo(83,66);ctx.lineTo(24,28);ctx.bezierCurveTo(5,15,-11,2,0,-31);ctx.fill();ctx.stroke();for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(4+i*7,-23+i*10);ctx.lineTo(39+i*5,-12+i*10);ctx.strokeStyle='#d99e83';ctx.lineWidth=2;ctx.stroke()}ctx.restore()}hand(-1);hand(1);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const top=projection(0,155,0),bottom=projection(0,-153,0);ctx.strokeStyle='#bb8641';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...top);ctx.lineTo(...bottom);ctx.stroke();ctx.strokeStyle='#eacb88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(top[0]-1,top[1]);ctx.lineTo(bottom[0]-1,bottom[1]);ctx.stroke();
// Real rotational motion sampled over the recent past; never substitute a rendered cylinder/cone/sphere.
if(Math.abs(omega)>=45)fullSpeedAfterimage();
drawPoly(pathAt(theta),Math.abs(omega)>=45?.48:.96);
ctx.strokeStyle='#8d6945';ctx.lineWidth=5;ctx.beginPath();let low=projection(0,-155,0);ctx.moveTo(...low);ctx.lineTo(low[0],H*.83);ctx.stroke();hands();ctx.textAlign='center';ctx.font='700 16px system-ui';ctx.fillStyle='#50766b';ctx.fillText('손을 좌우로 여러 번 빠르게 비벼요 ↔',W/2,H*.95)}
function tick(now){let dt=Math.min((now-prev)/1000,.04);prev=now;theta+=omega*dt;omega*=Math.exp(-dt*.8);if(Math.abs(omega)<.02)omega=0;handShift*=.85; // fade actual historical frames, not pre-made silhouettes
// No artificial afterimages below 100%; only the rotating sheet is drawn.
draw();let pct=Math.min(100,Math.round(Math.abs(omega)/45*100));document.getElementById('fill').style.width=pct+'%';document.getElementById('speed').textContent='회전 속도 '+pct+'%';document.getElementById('status').textContent=pct===100?'✨ 회전 잔상 완성! 어떤 회전체인가요?':pct<8?'아직 천천히 돌아요':'더 빠르게 비벼서 100%에 도전!' ;requestAnimationFrame(tick)}requestAnimationFrame(tick);
cv.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastT=performance.now();lastDir=0;stroke=0;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;let x=e.clientX,dx=x-lastX;lastX=x;handShift=Math.max(-22,Math.min(22,dx*2));let dir=Math.sign(dx);if(Math.abs(dx)>2){stroke+=Math.abs(dx);if(lastDir&&dir!==lastDir&&stroke>24){omega=Math.min(55,omega+7.5);stroke=0}lastDir=dir;if(stroke>75){omega=Math.min(55,omega+2.5);stroke=0}}});function stop(){drag=false}cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);document.querySelectorAll('[data-shape]').forEach(b=>b.addEventListener('click',()=>{shape=b.dataset.shape;omega=0;theta=.35;trails=[];document.querySelectorAll('[data-shape]').forEach(q=>q.classList.toggle('active',q===b))}));document.getElementById('reset').onclick=()=>{omega=0;theta=.35;trails=[]};
</script></body></html>
